[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpa-aes-chipwhisperer"
version = "1.1.0"
description = "Correlation Power Analysis attack on AES-128 using ChipWhisperer-Lite + XMEGA (teaching demo)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mohsin Khan" }]
keywords = ["side-channel", "cpa", "aes", "chipwhisperer", "teaching"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
hardware = [
    "chipwhisperer==6.0.0",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "pycryptodome>=3.20",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "pycryptodome>=3.20",
]

[project.scripts]
cpa-attack = "attack:main"
cpa-capture = "capture:main"
cpa-multikey = "cpa_multikey:main"
cpa-verify = "verify_recovery:main"

[tool.setuptools]
# run_cpa_from_notebook.py is intentionally NOT packaged: it is a verbatim
# NewAE tutorial export that runs the attack at import time.
py-modules = ["attack", "capture", "cpa_multikey", "verify_recovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["F", "E9"]